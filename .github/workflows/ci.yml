name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils
      - name: Unit tests
        run: npm test
      - name: Build, browser tests and scoreboard
        run: npm run scoreboard
      - name: Scoreboard is up to date
        run: |
          git diff --stat -- SCOREBOARD.md docs/scoreboard.json
          git diff --quiet -I '^Generated by' -I '"date"' -I 'open source (MIT)' -- SCOREBOARD.md docs/scoreboard.json docs/scoreboard.svg || echo "::warning::The committed scoreboard differs from this run. Run npm run scoreboard and commit."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: placard
          path: |
            dist/placard.html
            test-results/
